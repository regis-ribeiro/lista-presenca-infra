apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: colegioconecta-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "emissor-local"
    # Força o redirecionamento para HTTPS imediatamente
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # IMPORTANTE: Avisa ao NGINX para tratar o path como Expressão Regular
    nginx.ingress.kubernetes.io/use-regex: "true"
    # A MÁGICA: Remove o /api do caminho antes de enviar ao Pod do backend, porque o Spring Boot não tem essa rota
    nginx.ingress.kubernetes.io/rewrite-target: /\$1
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - colegioconecta.nprd.app
      secretName: colegioconecta-tls
  rules:
  - host: colegioconecta.nprd.app
    http:
      paths:
      # Rota Front (Apontando para o frontend-k3s.yaml)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: lista-presenca-frontend 
            port:
              number: 80
      # Rota API (Apontando para o backend-k3s.yaml)
      # Captura tudo após /api e joga na variável \$1, que é usada no rewrite-target para remover o /api do caminho
      - path: /api/?(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: lista-presenca-backend
            port:
              number: 8080